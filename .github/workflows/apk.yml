name: APK derle

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: SDK paketleri
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: APK derle
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Adini duzelt
        run: cp android/app/build/outputs/apk/debug/app-debug.apk gece-bekcisi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: gece-bekcisi-apk
          path: gece-bekcisi.apk

      - name: Release'e koy (indirme adresi sabit kalir)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apk >/dev/null 2>&1 || \
            gh release create apk --title "Gece Bekcisi APK" \
              --notes "Samsung'a yan yukleme icin. Tarayicidan indirip kurun."
          gh release upload apk gece-bekcisi.apk --clobber
